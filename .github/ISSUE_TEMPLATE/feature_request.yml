name: Feature request

description: Suggest a capability the server does not have yet

body:
  - type: markdown
    attributes:
      value: |
        A good request explains the situation it solves. "I want the server to
        do X" is more useful when it comes with an example of the mistake you
        are trying to avoid.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong today, and what the agent does instead
      render: text
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: The behaviour you are asking for
      render: text
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      render: text
